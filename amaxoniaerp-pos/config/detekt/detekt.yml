config:
  validation: true
  warningsAsErrors: true

naming:
  ConstructorParameterNaming:
    # Snake case is restricted to immutable backend DTO contracts whose JSON
    # field names cannot be changed without a coordinated API migration.
    parameterPattern: '[a-z][A-Za-z0-9_]*'
    privateParameterPattern: '[a-z][A-Za-z0-9_]*'
  FunctionNaming:
    # Compose requires PascalCase for functions that emit UI.
    ignoreAnnotated:
      - Composable

style:
  MagicNumber:
    # A named value is self-documenting; numeric literals embedded in business
    # calculations remain actionable findings.
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreRanges: true
  MaxLineLength:
    # Keep one source of truth with .editorconfig/ktlint.
    maxLineLength: 140

complexity:
  LongParameterList:
    # Room DAOs bind a distinct SQL placeholder per parameter; grouping them
    # into holder data classes adds boilerplate without improving readability.
    ignoreAnnotated:
      - Query
      - Insert
      - Update
      - Delete
  TooManyFunctions:
    # Room @Dao interfaces are SQL verb collections — one function per
    # statement is idiomatic and splitting them across files would break the
    # single-ledger mental model. SyncScheduler is the single
    # WorkManager facade for the app.
    thresholdInInterfaces: 20
    thresholdInClasses: 20
    thresholdInObjects: 20
    thresholdInFiles: 20
