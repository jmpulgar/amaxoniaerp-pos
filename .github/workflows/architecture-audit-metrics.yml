name: Architecture Audit Metrics

on:
  push:
    branches:
      - architecture-block1-validation
  workflow_dispatch:

jobs:
  audit-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect TASK-001 and TASK-002 metrics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          android_main = root / 'amaxoniaerp-pos/app/src/main/java/com/amaxonia/pos'
          android_test_roots = [
              root / 'amaxoniaerp-pos/app/src/test/java/com/amaxonia/pos',
              root / 'amaxoniaerp-pos/app/src/androidTest/java/com/amaxonia/pos',
          ]
          backend_features = root / 'amaxoniaerp-backend/src/main/kotlin/com/amaxoniaerp/features'
          backend_tests = root / 'amaxoniaerp-backend/src/test/kotlin/com/amaxoniaerp'

          def kotlin_files(base):
              return sorted(base.rglob('*.kt')) if base.exists() else []

          def rel(p):
              return str(p).replace('\\', '/')

          print('=== ANDROID_FEATURE_INVENTORY ===')
          ui_root = android_main / 'ui'
          shared_ui = {'common', 'navigation', 'theme'}
          android_features = sorted(p.name for p in ui_root.iterdir() if p.is_dir() and p.name not in shared_ui)
          print('android_feature_count=' + str(len(android_features)))
          for feature in android_features:
              ui_files = kotlin_files(ui_root / feature)
              usecase_dir = android_main / 'domain/usecase' / ({'creditnotes':'creditnote'}.get(feature, feature))
              usecases = kotlin_files(usecase_dir)
              tests = []
              for tr in android_test_roots:
                  candidates = [tr / 'ui' / feature, tr / 'domain/usecase' / ({'creditnotes':'creditnote'}.get(feature, feature))]
                  for c in candidates:
                      tests.extend(kotlin_files(c))
              direct_container = [p for p in ui_files if 'DependencyContainer' in p.read_text(errors='ignore')]
              data_imports = [p for p in ui_files if re.search(r'^import com\.amaxonia\.pos\.data\.', p.read_text(errors='ignore'), re.M)]
              print(f'{feature}|ui={len(ui_files)}|usecases={len(usecases)}|tests={len(set(tests))}|container={len(direct_container)}|ui_data_imports={len(data_imports)}')

          print('=== BACKEND_FEATURE_INVENTORY ===')
          backend_feature_names = sorted(p.name for p in backend_features.iterdir() if p.is_dir())
          print('backend_feature_count=' + str(len(backend_feature_names)))
          for feature in backend_feature_names:
              fd = backend_features / feature
              dirs = sorted(p.name for p in fd.iterdir() if p.is_dir())
              prod = kotlin_files(fd)
              tests = kotlin_files(backend_tests / 'features' / feature)
              route_files = [p for p in prod if '/route/' in rel(p) or p.name.endswith('Routing.kt') or p.name.endswith('Routes.kt')]
              generic_catch = [p for p in route_files if re.search(r'catch\s*\([^)]*(?:Exception|Throwable)', p.read_text(errors='ignore'))]
              tenant_markers = [p for p in route_files if re.search(r'Company-DB|admin_db|country_code|token_type|resolve\w*Company|resolve\w*Tenant', p.read_text(errors='ignore'), re.I)]
              external_io = [p for p in prod if re.search(r'HttpClient|client\.(get|post|put|delete)|PAC|HKA', p.read_text(errors='ignore'), re.I)]
              print(f'{feature}|dirs={",".join(dirs) or "-"}|prod={len(prod)}|tests={len(tests)}|route_generic_catch={len(generic_catch)}|route_tenant_markers={len(tenant_markers)}|external_io_files={len(external_io)}')

          prod_android_files = kotlin_files(android_main)
          screen_vm = [p for p in prod_android_files if p.name.endswith('Screen.kt') or p.name.endswith('ViewModel.kt')]
          direct_container = [p for p in screen_vm if 'DependencyContainer' in p.read_text(errors='ignore')]
          domain_files = kotlin_files(android_main / 'domain')
          domain_bad_imports = [p for p in domain_files if re.search(r'^import com\.amaxonia\.pos\.(?:data|ui)\.', p.read_text(errors='ignore'), re.M)]
          ui_files_all = kotlin_files(android_main / 'ui')
          ui_data_imports = [p for p in ui_files_all if re.search(r'^import com\.amaxonia\.pos\.data\.', p.read_text(errors='ignore'), re.M)]

          backend_prod = kotlin_files(root / 'amaxoniaerp-backend/src/main/kotlin')
          backend_route_files = [p for p in backend_prod if '/features/' in rel(p) and ('/route/' in rel(p) or p.name.endswith('Routing.kt') or p.name.endswith('Routes.kt'))]
          generic_route_files = [p for p in backend_route_files if re.search(r'catch\s*\([^)]*(?:Exception|Throwable)', p.read_text(errors='ignore'))]
          tenant_route_files = [p for p in backend_route_files if re.search(r'Company-DB|admin_db|country_code|token_type|resolve\w*Company|resolve\w*Tenant', p.read_text(errors='ignore'), re.I)]
          backend_domain = [p for p in backend_prod if '/features/' in rel(p) and '/domain/' in rel(p)]
          backend_domain_framework = [p for p in backend_domain if re.search(r'^import (?:io\.ktor|org\.jetbrains\.exposed)\.', p.read_text(errors='ignore'), re.M)]
          route_dbmanager = [p for p in backend_route_files if 'DatabaseManager' in p.read_text(errors='ignore')]
          route_httpclient = [p for p in backend_route_files if re.search(r'HttpClient\s*\(', p.read_text(errors='ignore'))]

          suppress_re = re.compile(r'@(file:)?Suppress\s*\(')
          android_suppress = sum(len(suppress_re.findall(p.read_text(errors='ignore'))) for p in prod_android_files)
          backend_suppress = sum(len(suppress_re.findall(p.read_text(errors='ignore'))) for p in backend_prod)

          baseline = root / 'amaxoniaerp-pos/config/detekt/detekt-baseline.xml'
          baseline_text = baseline.read_text(errors='ignore') if baseline.exists() else ''
          detekt_baseline_findings = baseline_text.count('<ID>')

          android_missing_tests = []
          for feature in android_features:
              hit = False
              key = {'creditnotes':'creditnote'}.get(feature, feature)
              for tr in android_test_roots:
                  if kotlin_files(tr / 'ui' / feature) or kotlin_files(tr / 'domain/usecase' / key):
                      hit = True
              if not hit:
                  android_missing_tests.append(feature)

          backend_missing_tests = [f for f in backend_feature_names if not kotlin_files(backend_tests / 'features' / f)]

          print('=== SCORECARD ===')
          print('android_screen_viewmodel_dependencycontainer_files=' + str(len(direct_container)))
          print('android_screen_viewmodel_dependencycontainer_paths=' + ';'.join(rel(p) for p in direct_container))
          print('android_domain_to_data_or_ui_files=' + str(len(domain_bad_imports)))
          print('android_ui_to_data_files=' + str(len(ui_data_imports)))
          print('backend_route_generic_exception_files=' + str(len(generic_route_files)))
          print('backend_route_generic_exception_paths=' + ';'.join(rel(p) for p in generic_route_files))
          print('backend_route_tenant_marker_files=' + str(len(tenant_route_files)))
          print('backend_route_tenant_marker_paths=' + ';'.join(rel(p) for p in tenant_route_files))
          print('backend_domain_framework_import_files=' + str(len(backend_domain_framework)))
          print('backend_route_databasemanager_files=' + str(len(route_dbmanager)))
          print('backend_route_httpclient_creation_files=' + str(len(route_httpclient)))
          print('android_detekt_baseline_findings=' + str(detekt_baseline_findings))
          print('android_prod_suppressions=' + str(android_suppress))
          print('backend_prod_suppressions=' + str(backend_suppress))
          print('android_features_missing_path_matched_tests=' + str(len(android_missing_tests)) + ':' + ','.join(android_missing_tests))
          print('backend_features_missing_path_matched_tests=' + str(len(backend_missing_tests)) + ':' + ','.join(backend_missing_tests))
          print('ci_workflow_count=' + str(len(list((root / '.github/workflows').glob('*.yml')))))
          PY
