name: Architecture Coverage Audit

on:
  push:
    branches:
      - architecture-block1-validation
  workflow_dispatch:

jobs:
  android-coverage-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: amaxoniaerp-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Measure real Android line coverage
        run: ./gradlew :app:koverLog --no-daemon --console=plain

  backend-coverage-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: amaxoniaerp-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Apply Kover only in runner for baseline measurement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.gradle.kts')
          text = p.read_text()
          text = text.replace('plugins {\n', 'plugins {\n    id("org.jetbrains.kotlinx.kover") version "0.9.9"\n', 1)
          p.write_text(text)
          PY
      - name: Measure real Backend line coverage
        run: ./gradlew koverLog --no-daemon --console=plain
