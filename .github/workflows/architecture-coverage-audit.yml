name: Architecture Coverage Audit

on:
  push:
    branches:
      - architecture-block1-validation
  workflow_dispatch:

jobs:
  android-coverage-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: amaxoniaerp-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Measure real Android Amaxonia debug line coverage
        run: ./gradlew :app:koverLogAmaxoniaDebug --no-daemon --console=plain
