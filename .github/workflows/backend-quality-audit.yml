name: Backend Quality Debt Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality-debt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: amaxoniaerp-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew ktlintCheck detekt test build --no-daemon --console=plain
