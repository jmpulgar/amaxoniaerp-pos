name: Backend Quality Debt Audit

on:
  push:
    branches:
      - architecture-block1-validation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-quality-debt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: amaxoniaerp-backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-block1-validation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Apply ktlint formatting
        run: ./gradlew ktlintFormat --no-daemon --console=plain
      - name: Commit formatting-only changes
        working-directory: .
        run: |
          if git diff --quiet -- amaxoniaerp-backend; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amaxoniaerp-backend
          git commit -m "Format backend with ktlint"
          git push origin HEAD:architecture-block1-validation
      - name: Verify ktlint
        run: ./gradlew ktlintCheck --no-daemon --console=plain
