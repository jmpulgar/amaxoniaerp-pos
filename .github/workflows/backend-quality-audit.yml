name: Backend Quality Debt Audit

on:
  workflow_dispatch:

jobs:
  backend-quality-debt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: amaxoniaerp-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Detekt
        id: detekt
        continue-on-error: true
        run: ./gradlew detekt --no-daemon --console=plain > /tmp/detekt.log 2>&1
      - name: ktlint
        id: ktlint
        continue-on-error: true
        run: ./gradlew ktlintCheck --no-daemon --console=plain > /tmp/ktlint.log 2>&1
      - name: Print concise quality result
        if: always()
        run: |
          echo "=== DETEKT ==="
          grep -E "weighted issues|BUILD (SUCCESSFUL|FAILED)|[0-9]+ weighted issues" /tmp/detekt.log || true
          echo "=== KTLINT TXT REPORTS ==="
          find build/reports/ktlint -type f -name '*.txt' -exec cat {} \; || true
          echo "=== OUTCOMES ==="
          echo "detekt_outcome=${{ steps.detekt.outcome }}"
          echo "ktlint_outcome=${{ steps.ktlint.outcome }}"
