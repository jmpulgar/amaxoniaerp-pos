name: Backend Quality Codemod

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  task022-mechanical:
    if: contains(github.event.head_commit.message, '[task022-codemod]') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply deterministic mechanical cleanup
        run: python .github/scripts/task022_codemod.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Verify tests and ktlint before commit
        working-directory: amaxoniaerp-backend
        run: |
          chmod +x gradlew
          ./gradlew test ktlintCheck --no-daemon
      - name: Commit verified cleanup
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amaxoniaerp-backend/src/main/kotlin amaxoniaerp-backend/src/test/kotlin
          git commit -m "quality: apply TASK-022 mechanical cleanup"
          git push origin HEAD:main
