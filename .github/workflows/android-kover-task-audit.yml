name: Android Kover Task Audit

on:
  workflow_dispatch:

jobs:
  list-kover-tasks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amaxoniaerp-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:tasks --all --no-daemon --console=plain | grep -i kover
