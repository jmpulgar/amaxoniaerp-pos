name: Baseline Architecture Audit

on:
  push:
    branches:
      - architecture-block1-validation
  workflow_dispatch:

jobs:
  android-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: amaxoniaerp-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android unit tests
        run: ./gradlew test --no-daemon
      - name: Android Detekt
        run: ./gradlew detekt --no-daemon
      - name: Android ktlint
        run: ./gradlew ktlintCheck --no-daemon
      - name: Android builds
        run: ./gradlew assembleAmaxoniaDebug assembleBanescoVenezuelaDebug assembleListoerpDebug --no-daemon

  backend-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: amaxoniaerp-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend tests
        run: ./gradlew test --no-daemon
      - name: Backend build
        run: ./gradlew build --no-daemon
