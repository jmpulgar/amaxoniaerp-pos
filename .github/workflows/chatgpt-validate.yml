name: ChatGPT Android Validation

on:
  push:
    branches:
      - chatgpt/phase4-detekt-cleanup

jobs:
  detekt:
    if: contains(github.event.head_commit.message, '[validate]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: amaxoniaerp-pos/**/*.gradle*
      - name: Make Gradle wrapper executable
        working-directory: amaxoniaerp-pos
        run: chmod +x gradlew
      - name: Detekt
        working-directory: amaxoniaerp-pos
        run: ./gradlew :app:detektAmaxoniaDebug --no-daemon --console=plain

  build:
    if: contains(github.event.head_commit.message, '[validate]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: amaxoniaerp-pos/**/*.gradle*
      - name: Make Gradle wrapper executable
        working-directory: amaxoniaerp-pos
        run: chmod +x gradlew
      - name: Ktlint
        working-directory: amaxoniaerp-pos
        run: ./gradlew :app:ktlintAmaxoniaDebugSourceSetCheck --no-daemon --console=plain
      - name: Assemble
        working-directory: amaxoniaerp-pos
        run: ./gradlew :app:assembleAmaxoniaDebug --no-daemon --console=plain
