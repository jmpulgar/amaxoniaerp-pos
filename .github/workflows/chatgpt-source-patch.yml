              ) {
                  Surface(
                      color = productColor.copy(alpha = 0.1f),
                      shape = RoundedCornerShape(10.dp),
                      modifier = Modifier.size(40.dp),
                  ) {
                      Box(contentAlignment = Alignment.Center) {
                          Text(
                              text = position.toString(),
                              style = MaterialTheme.typography.titleMedium,
                              fontWeight = FontWeight.Bold,
                              color = productColor,
                          )
                      }
                  }
                  Spacer(modifier = Modifier.width(12.dp))
                  BestSellerDetails(
                      product = product,
                      productColor = productColor,
                      modifier = Modifier.weight(1f),
                  )
                  Spacer(modifier = Modifier.width(10.dp))
                  AdaptiveAmountText(
                      text = money("$", product.price, separator = ""),
                      modifier = Modifier.weight(BEST_SELLER_AMOUNT_WEIGHT),
                      baseStyle =
                          MaterialTheme.typography.titleMedium.copy(
                              fontWeight = FontWeight.Bold,
                              textAlign = TextAlign.End,
                          ),
                      color = MaterialTheme.colorScheme.primary,
                      options =
                          com.amaxonia.pos.ui.common.components.AdaptiveAmountOptions(
                              minFontSizeSp = 10f,
                          ),
                  )
              }
          }

          @Composable
          private fun BestSellerDetails(
              product: BestSellerProduct,
              productColor: Color,
              modifier: Modifier = Modifier,
          ) {
              Column(modifier = modifier) {
                  Text(
                      text = product.name,
                      style = MaterialTheme.typography.bodyMedium,
                      fontWeight = FontWeight.Bold,
                      color = MaterialTheme.colorScheme.onSurface,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis,
                  )
                  Spacer(modifier = Modifier.height(4.dp))
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text(
                          text = "${product.salesCount} ventas",
                          style = MaterialTheme.typography.labelMedium,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                          maxLines = 1,
                      )
                      Spacer(modifier = Modifier.width(10.dp))
                      LinearProgressIndicator(
                          progress = { product.progress },
                          modifier = Modifier.weight(1f).height(6.dp).clip(RoundedCornerShape(3.dp)),
                          color = productColor,
                          trackColor = productColor.copy(alpha = 0.1f),
                      )
                  }
              }
          }

          ''',
              'BestSellerItem',
          )
          write(path, text)

          # ---- DraftInvoicesScreen: extract app bar ----
          path = root / 'ui/drafts/DraftInvoicesScreen.kt'
          text = read(path)
          old_topbar = '''topBar = {
                      TopAppBar(
                          title = {
                              Text(
                                  text = "Facturas pendientes",
                                  style = MaterialTheme.typography.titleLarge,
                                  fontWeight = FontWeight.Bold,
                                  color = MaterialTheme.colorScheme.primary,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis,
                              )
                          },
                          navigationIcon = {
                              IconButton(
                                  onClick = onBack,
                                  modifier = Modifier.size(48.dp),
                              ) {
                                  Icon(
                                      imageVector = Icons.AutoMirrored.Filled.ArrowBack,
                                      contentDescription = "Volver",
                                      tint = MaterialTheme.colorScheme.primary,
                                  )
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.background),
                      )
                  },'''
          text = replace_once(text, old_topbar, 'topBar = { DraftInvoicesTopBar(onBack = onBack) },', 'Draft top bar')
          marker = '\n@Composable\nprivate fun DraftLoadingState'
          helper = '''
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          private fun DraftInvoicesTopBar(onBack: () -> Unit) {
              TopAppBar(
                  title = {
                      Text(
                          text = "Facturas pendientes",
                          style = MaterialTheme.typography.titleLarge,
                          fontWeight = FontWeight.Bold,
                          color = MaterialTheme.colorScheme.primary,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                      )
                  },
                  navigationIcon = {
                      IconButton(
                          onClick = onBack,
                          modifier = Modifier.size(48.dp),
                      ) {
                          Icon(
                              imageVector = Icons.AutoMirrored.Filled.ArrowBack,
