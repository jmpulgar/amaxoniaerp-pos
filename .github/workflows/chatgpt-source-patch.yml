              '@Composable\nprivate fun BestSellerItem(',
              '\nprivate fun money(',
              '''@Composable
          private fun BestSellerItem(
              product: BestSellerProduct,
              position: Int,
          ) {
              val productColor = Color(product.colorHex)
              Row(
                  modifier = Modifier.fillMaxWidth(),
