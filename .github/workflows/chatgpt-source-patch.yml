name: ChatGPT Source Patch

on:
  push:
    branches:
      - chatgpt/phase4-detekt-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'run detekt patch a')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase4-detekt-cleanup
          fetch-depth: 0

      - name: Refactor remaining Compose findings A
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('amaxoniaerp-pos/app/src/main/java/com/amaxonia/pos')

          def read(path):
              return path.read_text(encoding='utf-8')

          def write(path, text):
              path.write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing target: {label}')
              return text.replace(old, new, 1)

          def replace_region(text, start, end, replacement, label):
              try:
                  s = text.index(start)
                  e = text.index(end, s)
              except ValueError as exc:
                  raise SystemExit(f'Missing region: {label}') from exc
              return text[:s] + replacement + text[e:]

          # ---- CierreCajaScreen ----
          path = root / 'ui/caja/CierreCajaScreen.kt'
          text = read(path)
          text = replace_once(
              text,
              '''/** Acciones del cierre agrupadas para mantener las firmas de los composables pequeñas. */
          internal class CierreCajaActions(
              val onConfirmClose: () -> Unit,
              val onPrintReportX: () -> Unit,
              val onPrintReportZ: () -> Unit,
          )

          ''',
              '',
              'CierreCajaActions inline declaration',
          )
          text = replace_once(
              text,
              '''summary = state.summary,
                                  isClosing = false,
                                  isPrintingReportX = isPrintingX,
                                  isPrintingReportZ = isPrintingZ,
                                  showReportButtons = viewModel.hasActivePrinter,
                                  actions =''',
              '''summary = state.summary,
                                  state =
                                      CierreCajaReadyState(
                                          isClosing = false,
                                          isPrintingReportX = isPrintingX,
                                          isPrintingReportZ = isPrintingZ,
                                          showReportButtons = viewModel.hasActivePrinter,
                                      ),
                                  actions =''',
              'Cierre ready call',
          )
          text = replace_once(
              text,
              '''summary = state.summary,
                                  isClosing = true,
                                  isPrintingReportX = false,
                                  isPrintingReportZ = false,
                                  showReportButtons = viewModel.hasActivePrinter,
                                  actions =''',
              '''summary = state.summary,
                                  state =
                                      CierreCajaReadyState(
                                          isClosing = true,
                                          isPrintingReportX = false,
                                          isPrintingReportZ = false,
                                          showReportButtons = viewModel.hasActivePrinter,
                                      ),
                                  actions =''',
              'Cierre closing call',
          )
          text = replace_region(
              text,
              '@Composable\ninternal fun ReadyContent(',
              '\n@Composable\nprivate fun CajaHeaderCard',
              '''@Composable
          internal fun ReadyContent(
              summary: CierreCajaSummary,
              state: CierreCajaReadyState,
              actions: CierreCajaActions,
          ) {
              Column(
                  modifier =
                      Modifier
                          .fillMaxSize()
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = 20.dp)
                          .padding(bottom = 24.dp),
              ) {
                  Spacer(modifier = Modifier.height(8.dp))
                  CajaHeaderCard(summary = summary)
                  Spacer(modifier = Modifier.height(20.dp))
                  SectionTitle("Resumen de Ventas")
                  Spacer(modifier = Modifier.height(12.dp))
                  VentasSummaryCard(summary = summary)
                  Spacer(modifier = Modifier.height(20.dp))
                  SectionTitle("Desglose por Método de Pago")
                  Spacer(modifier = Modifier.height(12.dp))
                  PaymentBreakdownCard(summary = summary)
                  Spacer(modifier = Modifier.height(20.dp))
                  ExpectedCloseCard(summary = summary)
                  Spacer(modifier = Modifier.height(32.dp))
                  if (state.showReportButtons) {
                      ReportButtons(state = state, actions = actions)
                      Spacer(modifier = Modifier.height(16.dp))
                  }
                  ConfirmCloseButton(isClosing = state.isClosing, onConfirmClose = actions.onConfirmClose)
              }
          }
          ''',
              'ReadyContent',
          )
          text = replace_region(
              text,
              '@Composable\nprivate fun CajaHeaderCard',
              '\n@Composable\nprivate fun VentasSummaryCard',
              '''@Composable
          private fun CajaHeaderCard(summary: CierreCajaSummary) {
              ElevatedCard(
                  modifier = Modifier.fillMaxWidth(),
                  shape = RoundedCornerShape(20.dp),
                  colors = CardDefaults.elevatedCardColors(containerColor = MaterialTheme.colorScheme.primary),
                  elevation = CardDefaults.elevatedCardElevation(defaultElevation = 4.dp),
              ) {
                  Column(modifier = Modifier.padding(24.dp)) {
                      CajaHeaderIdentity(summary)
                      Spacer(modifier = Modifier.height(20.dp))
                      HorizontalDivider(color = PosPalette.FixedWhite.copy(alpha = 0.2f))
                      Spacer(modifier = Modifier.height(16.dp))
                      CajaHeaderStats(summary)
                  }
              }
          }

          @Composable
          private fun CajaHeaderIdentity(summary: CierreCajaSummary) {
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Box(
                      modifier =
                          Modifier
                              .size(44.dp)
                              .clip(CircleShape)
                              .background(PosPalette.FixedWhite.copy(alpha = 0.2f)),
                      contentAlignment = Alignment.Center,
                  ) {
                      Icon(
                          Icons.Rounded.PointOfSale,
                          contentDescription = null,
                          tint = PosPalette.FixedWhite,
                          modifier = Modifier.size(24.dp),
                      )
                  }
                  Spacer(modifier = Modifier.width(16.dp))
                  Column(modifier = Modifier.weight(1f)) {
                      Text(
                          text = summary.cajaName,
                          fontWeight = FontWeight.Bold,
                          fontSize = 20.sp,
                          color = PosPalette.FixedWhite,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                      )
                      Row(
                          verticalAlignment = Alignment.CenterVertically,
                          modifier = Modifier.padding(top = 4.dp),
                      ) {
                          Icon(
                              Icons.Rounded.Schedule,
                              contentDescription = null,
                              tint = PosPalette.FixedWhite.copy(alpha = 0.7f),
                              modifier = Modifier.size(14.dp),
                          )
                          Spacer(modifier = Modifier.width(4.dp))
                          Text(
                              text = "Abierta: ${summary.openedAt}",
                              fontSize = 12.sp,
                              color = PosPalette.FixedWhite.copy(alpha = 0.7f),
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis,
                          )
                      }
                  }
              }
          }

          @Composable
          private fun CajaHeaderStats(summary: CierreCajaSummary) {
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalArrangement = Arrangement.SpaceBetween,
              ) {
                  MiniStat(
                      label = "Monto Apertura",
                      value = formatMoney(summary.openAmount),
                      color = PosPalette.FixedWhite,
                      modifier = Modifier.weight(1f),
                  )
                  MiniStat(
                      label = "Transacciones",
                      value = "${summary.transactionCount}",
                      color = PosPalette.FixedWhite,
                      modifier = Modifier.weight(1f),
                  )
              }
          }
          ''',
              'CajaHeaderCard',
          )
          text = replace_region(
              text,
              '@Composable\nprivate fun ReportButtons(',
              '\n@Composable\nprivate fun ConfirmCloseButton',
              '''@Composable
          private fun ReportButtons(
              state: CierreCajaReadyState,
              actions: CierreCajaActions,
          ) {
              val enabled = !state.isClosing && !state.isPrintingReportX && !state.isPrintingReportZ
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalArrangement = Arrangement.spacedBy(12.dp),
              ) {
                  Box(modifier = Modifier.weight(1f)) {
                      ReportXButton(
                          isPrinting = state.isPrintingReportX,
                          enabled = enabled,
                          onClick = actions.onPrintReportX,
                      )
                  }
                  Box(modifier = Modifier.weight(1f)) {
                      ReportZButton(
                          isPrinting = state.isPrintingReportZ,
                          enabled = enabled,
                          onClick = actions.onPrintReportZ,
                      )
                  }
              }
          }

          @Composable
          private fun ReportXButton(
              isPrinting: Boolean,
              enabled: Boolean,
              onClick: () -> Unit,
          ) {
              OutlinedButton(
                  onClick = onClick,
                  enabled = enabled,
                  modifier = Modifier.fillMaxWidth().height(52.dp),
                  shape = RoundedCornerShape(14.dp),
                  colors =
                      ButtonDefaults.outlinedButtonColors(
                          contentColor = MaterialTheme.colorScheme.primary,
                          disabledContentColor = MaterialTheme.colorScheme.primary.copy(alpha = 0.4f),
                      ),
              ) {
                  if (isPrinting) {
                      CircularProgressIndicator(
                          strokeWidth = 2.dp,
                          modifier = Modifier.size(18.dp),
                          color = MaterialTheme.colorScheme.primary,
                      )
                  } else {
                      Icon(
                          Icons.AutoMirrored.Rounded.Assignment,
                          contentDescription = null,
                          modifier = Modifier.size(20.dp),
                      )
                  }
                  Spacer(modifier = Modifier.width(8.dp))
                  Text(
                      if (isPrinting) "Imprimiendo..." else "Reporte X",
                      fontWeight = FontWeight.Bold,
                      fontSize = 14.sp,
                  )
              }
          }

          @Composable
          private fun ReportZButton(
              isPrinting: Boolean,
              enabled: Boolean,
              onClick: () -> Unit,
          ) {
              OutlinedButton(
                  onClick = onClick,
                  enabled = enabled,
                  modifier = Modifier.fillMaxWidth().height(52.dp),
                  shape = RoundedCornerShape(14.dp),
                  colors =
                      ButtonDefaults.outlinedButtonColors(
                          contentColor = MaterialTheme.colorScheme.error,
                          disabledContentColor = MaterialTheme.colorScheme.error.copy(alpha = 0.4f),
                      ),
              ) {
                  if (isPrinting) {
                      CircularProgressIndicator(
                          strokeWidth = 2.dp,
                          modifier = Modifier.size(18.dp),
                          color = MaterialTheme.colorScheme.error,
                      )
                  } else {
                      Icon(
                          Icons.Rounded.Description,
                          contentDescription = null,
                          modifier = Modifier.size(20.dp),
                      )
                  }
                  Spacer(modifier = Modifier.width(8.dp))
                  Text(
                      if (isPrinting) "Imprimiendo..." else "Reporte Z",
                      fontWeight = FontWeight.Bold,
                      fontSize = 14.sp,
                  )
              }
          }
          ''',
              'ReportButtons',
          )
          write(path, text)

          # Cash-close previews use the grouped presentation state.
          path = root / 'ui/caja/CierreCajaScreenPreviews.kt'
          text = read(path)
          text = text.replace(
              '''isClosing = false,
                          isPrintingReportX = false,
                          isPrintingReportZ = false,
                          showReportButtons = true,
          ''',
              '''state =
                              CierreCajaReadyState(
                                  isClosing = false,
                                  isPrintingReportX = false,
                                  isPrintingReportZ = false,
                                  showReportButtons = true,
                              ),
          ''',
          )
          text = replace_once(
              text,
              '''isClosing = true,
                          isPrintingReportX = false,
                          isPrintingReportZ = false,
                          showReportButtons = false,
          ''',
              '''state =
                              CierreCajaReadyState(
                                  isClosing = true,
                                  isPrintingReportX = false,
                                  isPrintingReportZ = false,
                                  showReportButtons = false,
                              ),
          ''',
              'Cierre closing preview',
          )
          write(path, text)

          # ---- CartScreen ----
          path = root / 'ui/cart/CartScreen.kt'
          text = read(path)
          text = replace_region(
              text,
              '@Composable\ninternal fun CartBottomBar(',
              '\n// ─────────────────────────────────────────────────────────────────────────────\n// Cliente + vendedor:',
              '''@Composable
          internal fun CartBottomBar(
              total: Double,
              secondaryTotal: String?,
              onSaveDraft: () -> Unit,
              onCheckout: () -> Unit,
              modifier: Modifier = Modifier,
          ) {
              Surface(
                  modifier = modifier,
                  color = MaterialTheme.colorScheme.surface,
                  shadowElevation = 16.dp,
                  shape = PosExtraShapes.BottomBarTop,
              ) {
                  BoxWithConstraints {
                      val compact = maxHeight < 480.dp
                      Column(
                          modifier =
                              Modifier
                                  .padding(horizontal = 20.dp, vertical = if (compact) 8.dp else 12.dp)
                                  .navigationBarsPadding(),
                      ) {
                          CartBottomTotal(total = total, secondaryTotal = secondaryTotal, compact = compact)
                          Spacer(modifier = Modifier.height(if (compact) 8.dp else 12.dp))
                          CartBottomActions(total = total, onSaveDraft = onSaveDraft, onCheckout = onCheckout)
                      }
                  }
              }
          }

          @Composable
          private fun CartBottomTotal(
              total: Double,
              secondaryTotal: String?,
              compact: Boolean,
          ) {
              val totalStyle =
                  if (compact) {
                      MaterialTheme.typography.headlineMedium.copy(fontWeight = FontWeight.ExtraBold)
                  } else {
                      PosTextStyles.totalDisplay
                  }
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalArrangement = Arrangement.SpaceBetween,
                  verticalAlignment = Alignment.Bottom,
              ) {
                  Text(
                      "Total",
                      style = MaterialTheme.typography.titleMedium,
                      fontWeight = FontWeight.Bold,
                      color = MaterialTheme.colorScheme.onSurface,
                  )
                  Column(horizontalAlignment = Alignment.End) {
                      AdaptiveAmountText(
                          text = "$${String.format(java.util.Locale.getDefault(), "%.2f", total)}",
                          baseStyle = totalStyle,
                          color = MaterialTheme.colorScheme.primary,
                          options =
                              com.amaxonia.pos.ui.common.components.AdaptiveAmountOptions(
                                  minFontSizeSp = 16f,
                              ),
                      )
                      secondaryTotal?.takeIf { it.isNotBlank() }?.let { secondary ->
                          Text(
                              secondary,
                              style = PosTextStyles.amountSecondary,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                      }
                  }
              }
          }

          @Composable
          private fun CartBottomActions(
              total: Double,
              onSaveDraft: () -> Unit,
              onCheckout: () -> Unit,
          ) {
              Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                  Box(modifier = Modifier.weight(1f)) {
                      SaveDraftButton(onClick = onSaveDraft)
                  }
                  Box(modifier = Modifier.weight(CHECKOUT_BUTTON_WEIGHT)) {
                      CheckoutButton(total = total, onClick = onCheckout)
                  }
              }
          }

          @Composable
          private fun SaveDraftButton(onClick: () -> Unit) {
              OutlinedButton(
                  onClick = onClick,
                  modifier = Modifier.fillMaxWidth().height(56.dp),
                  contentPadding = PaddingValues(horizontal = 8.dp),
                  shape = MaterialTheme.shapes.medium,
              ) {
                  Icon(Icons.Default.Save, null, modifier = Modifier.size(18.dp))
                  Spacer(modifier = Modifier.width(6.dp))
                  Text(
                      "Guardar",
                      style = MaterialTheme.typography.labelLarge,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis,
                  )
              }
          }

          @Composable
          private fun CheckoutButton(
              total: Double,
              onClick: () -> Unit,
          ) {
              Button(
                  onClick = onClick,
                  modifier = Modifier.fillMaxWidth().height(56.dp),
                  colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.primary),
                  contentPadding = PaddingValues(horizontal = 12.dp),
                  shape = MaterialTheme.shapes.medium,
                  elevation = ButtonDefaults.buttonElevation(defaultElevation = 2.dp, pressedElevation = 4.dp),
              ) {
                  AdaptiveAmountText(
                      text = "Cobrar $${String.format(java.util.Locale.getDefault(), "%.2f", total)}",
                      baseStyle = MaterialTheme.typography.titleLarge.copy(fontWeight = FontWeight.ExtraBold),
                      color = MaterialTheme.colorScheme.onPrimary,
                      options =
                          com.amaxonia.pos.ui.common.components.AdaptiveAmountOptions(
                              minFontSizeSp = 13f,
                          ),
                  )
              }
          }
          ''',
              'CartBottomBar',
          )
          text = replace_region(
              text,
              '@Composable\ninternal fun CartClientVendorPanel(',
              '\n@Composable\nprivate fun CartErrorBanner',
              '''@Composable
          internal fun CartClientVendorPanel(
              state: CartState,
              onSelectClient: () -> Unit,
              onRemoveClient: () -> Unit,
              onChangeSeller: () -> Unit,
              modifier: Modifier = Modifier,
          ) {
              Column(
                  modifier =
                      modifier
                          .fillMaxWidth()
                          .background(MaterialTheme.colorScheme.surface, MaterialTheme.shapes.medium)
                          .border(1.dp, MaterialTheme.colorScheme.outlineVariant, MaterialTheme.shapes.medium),
              ) {
                  CartClientRow(state = state, onSelectClient = onSelectClient, onRemoveClient = onRemoveClient)
                  HorizontalDivider(
                      color = MaterialTheme.colorScheme.outlineVariant,
                      modifier = Modifier.padding(horizontal = 14.dp),
                  )
                  CartSellerRow(state = state, onChangeSeller = onChangeSeller)
              }
          }

          @Composable
          private fun CartClientRow(
              state: CartState,
              onSelectClient: () -> Unit,
              onRemoveClient: () -> Unit,
          ) {
              Row(
                  modifier =
                      Modifier
                          .fillMaxWidth()
                          .clickable { onSelectClient() }
                          .padding(horizontal = 14.dp, vertical = 12.dp),
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  val selectedClient = state.selectedClient
                  if (selectedClient != null) {
                      ClientAvatar(
                          clientPhotoUrl = state.selectedClientPhotoUrl,
                          clientName = "${selectedClient.firstName} ${selectedClient.lastName}",
                      )
                      Spacer(modifier = Modifier.width(12.dp))
                      Column(modifier = Modifier.weight(1f)) {
                          Text(
                              "Cliente asignado",
                              style = MaterialTheme.typography.labelMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                          Text(
                              "${selectedClient.firstName} ${selectedClient.lastName}",
                              style = MaterialTheme.typography.titleSmall,
                              fontWeight = FontWeight.Bold,
                              color = MaterialTheme.colorScheme.onSurface,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis,
                          )
                      }
                      IconButton(onClick = onRemoveClient) {
                          Icon(
                              Icons.Default.Delete,
                              contentDescription = "Quitar cliente",
                              tint = MaterialTheme.colorScheme.error,
                          )
                      }
                  } else {
                      Icon(Icons.Default.Person, null, tint = MaterialTheme.colorScheme.primary)
                      Spacer(modifier = Modifier.width(12.dp))
                      Text(
                          "Asignar cliente",
                          modifier = Modifier.weight(1f),
                          style = MaterialTheme.typography.bodyLarge,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                      )
                      Icon(Icons.Default.Add, null, tint = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
              }
          }

          @Composable
          private fun CartSellerRow(
              state: CartState,
              onChangeSeller: () -> Unit,
          ) {
              Row(
                  modifier =
                      Modifier
                          .fillMaxWidth()
                          .clickable(enabled = state.availableSellers.isNotEmpty()) { onChangeSeller() }
                          .padding(horizontal = 14.dp, vertical = 12.dp),
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  Icon(Icons.Default.Storefront, null, tint = MaterialTheme.colorScheme.primary)
                  Spacer(modifier = Modifier.width(12.dp))
                  Column(modifier = Modifier.weight(1f)) {
                      Text(
                          "Vendedor asignado",
                          style = MaterialTheme.typography.labelMedium,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                      )
                      Text(
                          text = state.currentSeller?.nombre ?: "Sin vendedor",
                          style = MaterialTheme.typography.titleSmall,
                          fontWeight = FontWeight.Bold,
                          color = MaterialTheme.colorScheme.onSurface,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                      )
                  }
                  Icon(
                      Icons.Default.Autorenew,
                      contentDescription = "Cambiar vendedor",
                      tint =
                          if (state.availableSellers.isEmpty()) {
                              MaterialTheme.colorScheme.outline
                          } else {
                              MaterialTheme.colorScheme.primary
                          },
                  )
              }
          }
          ''',
              'CartClientVendorPanel',
          )
          write(path, text)

          # ---- History transaction card ----
          path = root / 'ui/history/HistoryScreen.kt'
          text = read(path)
          text = replace_region(
              text,
              '@Composable\ninternal fun TransactionCard(',
              '\n// ---------- Status Badge ----------',
              '''@Composable
          internal fun TransactionCard(
              transaction: Transaction,
              onClick: () -> Unit,
          ) {
              ElevatedCard(
                  modifier = Modifier.fillMaxWidth().clickable(onClick = onClick),
                  shape = RoundedCornerShape(16.dp),
                  colors = CardDefaults.elevatedCardColors(containerColor = MaterialTheme.colorScheme.surface),
                  elevation = CardDefaults.elevatedCardElevation(defaultElevation = 2.dp),
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth().padding(16.dp),
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      TransactionCardIcon()
                      Spacer(modifier = Modifier.width(14.dp))
                      TransactionCardInfo(transaction = transaction, modifier = Modifier.weight(1f))
                      TransactionCardAmount(transaction)
                      Icon(
                          imageVector = Icons.AutoMirrored.Filled.KeyboardArrowRight,
                          contentDescription = null,
                          tint = MaterialTheme.colorScheme.outline,
                          modifier = Modifier.padding(start = 4.dp).size(20.dp),
                      )
                  }
              }
          }

          @Composable
          private fun TransactionCardIcon() {
              Box(
                  modifier =
                      Modifier
                          .size(44.dp)
                          .clip(RoundedCornerShape(12.dp))
                          .background(MaterialTheme.colorScheme.primary.copy(alpha = 0.08f)),
                  contentAlignment = Alignment.Center,
              ) {
                  Icon(
                      Icons.Rounded.Receipt,
                      contentDescription = null,
                      tint = MaterialTheme.colorScheme.primary,
                      modifier = Modifier.size(22.dp),
                  )
              }
          }

          @Composable
          private fun TransactionCardInfo(
              transaction: Transaction,
              modifier: Modifier = Modifier,
          ) {
              Column(modifier = modifier) {
                  Text(
                      text = transaction.invoiceNumber,
                      fontWeight = FontWeight.Bold,
                      fontSize = 15.sp,
                      color = MaterialTheme.colorScheme.onSurface,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis,
                  )
                  Spacer(modifier = Modifier.height(6.dp))
                  StatusBadge(status = transaction.status)
                  Spacer(modifier = Modifier.height(6.dp))
                  TransactionMetadataRow(transaction)
              }
          }

          @Composable
          private fun TransactionMetadataRow(transaction: Transaction) {
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Icon(
                      Icons.Rounded.Schedule,
                      contentDescription = null,
                      tint = MaterialTheme.colorScheme.onSurfaceVariant,
                      modifier = Modifier.size(13.dp),
                  )
                  Spacer(modifier = Modifier.width(4.dp))
                  Text(
                      text = transaction.time,
                      fontSize = 12.sp,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                  )
                  if (transaction.clienteNombre.isNotBlank()) {
                      Spacer(modifier = Modifier.width(10.dp))
                      Icon(
                          Icons.Rounded.Person,
                          contentDescription = null,
                          tint = MaterialTheme.colorScheme.onSurfaceVariant,
                          modifier = Modifier.size(13.dp),
                      )
                      Spacer(modifier = Modifier.width(3.dp))
                      Text(
                          text = transaction.clienteNombre,
                          fontSize = 12.sp,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                          modifier = Modifier.weight(1f, fill = false),
                      )
                  }
              }
          }

          @Composable
          private fun TransactionCardAmount(transaction: Transaction) {
              Column(horizontalAlignment = Alignment.End) {
                  com.amaxonia.pos.ui.common.components.AdaptiveAmountText(
                      text = "${transaction.currency} ${String.format(java.util.Locale.getDefault(), "%.2f", transaction.amount)}",
                      baseStyle = MaterialTheme.typography.titleMedium.copy(fontWeight = FontWeight.Bold),
                      color = MaterialTheme.colorScheme.primary,
                      options =
                          com.amaxonia.pos.ui.common.components.AdaptiveAmountOptions(
                              minFontSizeSp = 11f,
                          ),
                  )
                  if (transaction.totalRef != null && transaction.totalRef > 0.0 && !transaction.abrMonedaSecundaria.isNullOrBlank()) {
                      Text(
                          text = "${formatCurrencyLabel(transaction.abrMonedaSecundaria)} ${String.format(java.util.Locale.getDefault(), "%.2f", transaction.totalRef)}",
                          fontSize = 11.sp,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                      )
                  }
              }
          }

          ''',
              'TransactionCard',
