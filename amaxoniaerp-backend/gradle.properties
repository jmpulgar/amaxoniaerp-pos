kotlin.code.style=official

# The deploy builds on a 4 GB server that also runs MySQL and the backend: keep every JVM bounded.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=448m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
# Compile Kotlin inside the Gradle JVM instead of a separate Kotlin daemon that outlives the build.
kotlin.compiler.execution.strategy=in-process
