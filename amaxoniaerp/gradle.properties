# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC

# Forzar JVM compatible (JDK 17) para evitar incompatibilidad con Java 25
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-17

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R class
android.nonTransitiveRClass=true
